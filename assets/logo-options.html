<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitCall — Logo Mark Options</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f4f4f4;
    font-family: 'Public Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-weight: 300;
    color: #1f2328;
    padding: 48px 32px 64px;
  }

  h1 {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #57606a;
    margin-bottom: 8px;
  }

  .wordmark-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 48px;
  }

  .wordmark {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: .02em;
    color: #1f2328;
  }

  .options-row {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .option {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .size-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .size-label {
    font-size: 10px;
    color: #8c8c8c;
    letter-spacing: .04em;
  }

  .option-meta {
    text-align: center;
    margin-top: 4px;
  }

  .option-num {
    font-size: 11px;
    font-weight: 400;
    color: #1f2328;
    display: block;
    margin-bottom: 2px;
  }

  .option-hex {
    font-size: 10px;
    color: #57606a;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  .divider {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 0 0 40px;
  }

  svg { display: block; }
</style>
</head>
<body>

<h1>OrbitCall — Logo Mark Options</h1>
<div class="wordmark-row">
  <!-- Option 1 mark at 28px next to wordmark, as a preview -->
  <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
    <rect width="28" height="28" fill="#0b6a72"/>
    <!-- timeline rail -->
    <rect x="3" y="15" width="22" height="2" fill="white" opacity=".35"/>
    <!-- solid contact block -->
    <rect x="3" y="10" width="8" height="5" fill="white"/>
    <!-- ghost block -->
    <rect x="13" y="10" width="7" height="5" fill="none" stroke="white" stroke-width="1.2"/>
    <!-- collision bar -->
    <rect x="11.5" y="8" width="1.5" height="9" fill="white"/>
  </svg>
  <span class="wordmark">OrbitCall</span>
</div>

<hr class="divider">

<div class="options-row">

  <!-- ── OPTION 1 ── conflict blocks on a timeline rail -->
  <div class="option">
    <div class="size-group">
      <span class="size-label">64px</span>
      <svg width="64" height="64" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#0b6a72"/>
        <rect x="3" y="15" width="22" height="2" fill="white" opacity=".35"/>
        <rect x="3" y="10" width="8" height="5" fill="white"/>
        <rect x="13" y="10" width="7" height="5" fill="none" stroke="white" stroke-width="1.2"/>
        <rect x="11.5" y="8" width="1.5" height="9" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">28px</span>
      <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#0b6a72"/>
        <rect x="3" y="15" width="22" height="2" fill="white" opacity=".35"/>
        <rect x="3" y="10" width="8" height="5" fill="white"/>
        <rect x="13" y="10" width="7" height="5" fill="none" stroke="white" stroke-width="1.2"/>
        <rect x="11.5" y="8" width="1.5" height="9" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">20px</span>
      <svg width="20" height="20" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#0b6a72"/>
        <rect x="3" y="15" width="22" height="2" fill="white" opacity=".35"/>
        <rect x="3" y="10" width="8" height="5" fill="white"/>
        <rect x="13" y="10" width="7" height="5" fill="none" stroke="white" stroke-width="1.2"/>
        <rect x="11.5" y="8" width="1.5" height="9" fill="white"/>
      </svg>
    </div>
    <div class="option-meta">
      <span class="option-num">Option 1</span>
      <span class="option-hex">#0b6a72</span>
    </div>
  </div>

  <!-- ── OPTION 2 ── three antenna lanes, one with a gap -->
  <div class="option">
    <div class="size-group">
      <span class="size-label">64px</span>
      <svg width="64" height="64" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#161616"/>
        <!-- lane 1 — full width -->
        <rect x="4" y="7" width="20" height="3.5" fill="white"/>
        <!-- lane 2 — gap in the middle (dropped contact) -->
        <rect x="4" y="12.5" width="7.5" height="3.5" fill="white"/>
        <rect x="16.5" y="12.5" width="7.5" height="3.5" fill="white"/>
        <!-- gap marker -->
        <rect x="12.5" y="12" width="3" height="4.5" fill="none" stroke="#42be65" stroke-width="1"/>
        <!-- lane 3 — shorter -->
        <rect x="4" y="18" width="14" height="3.5" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">28px</span>
      <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#161616"/>
        <rect x="4" y="7" width="20" height="3.5" fill="white"/>
        <rect x="4" y="12.5" width="7.5" height="3.5" fill="white"/>
        <rect x="16.5" y="12.5" width="7.5" height="3.5" fill="white"/>
        <rect x="12.5" y="12" width="3" height="4.5" fill="none" stroke="#42be65" stroke-width="1"/>
        <rect x="4" y="18" width="14" height="3.5" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">20px</span>
      <svg width="20" height="20" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#161616"/>
        <rect x="4" y="7" width="20" height="3.5" fill="white"/>
        <rect x="4" y="12.5" width="7.5" height="3.5" fill="white"/>
        <rect x="16.5" y="12.5" width="7.5" height="3.5" fill="white"/>
        <rect x="12.5" y="12" width="3" height="4.5" fill="none" stroke="#42be65" stroke-width="1"/>
        <rect x="4" y="18" width="14" height="3.5" fill="white"/>
      </svg>
    </div>
    <div class="option-meta">
      <span class="option-num">Option 2</span>
      <span class="option-hex">#161616 / #42be65</span>
    </div>
  </div>

  <!-- ── OPTION 3 ── orbit path crossing square, one dot on path -->
  <div class="option">
    <div class="size-group">
      <span class="size-label">64px</span>
      <svg width="64" height="64" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#0f62fe"/>
        <!-- inner square frame -->
        <rect x="5" y="5" width="18" height="18" fill="none" stroke="white" stroke-width="1.5"/>
        <!-- diagonal orbit path entering bottom-left, exiting top-right -->
        <line x1="2" y1="26" x2="26" y2="2" stroke="white" stroke-width="1.5"/>
        <!-- dot on the path -->
        <circle cx="18" cy="10" r="2.5" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">28px</span>
      <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#0f62fe"/>
        <rect x="5" y="5" width="18" height="18" fill="none" stroke="white" stroke-width="1.5"/>
        <line x1="2" y1="26" x2="26" y2="2" stroke="white" stroke-width="1.5"/>
        <circle cx="18" cy="10" r="2.5" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">20px</span>
      <svg width="20" height="20" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#0f62fe"/>
        <rect x="5" y="5" width="18" height="18" fill="none" stroke="white" stroke-width="1.5"/>
        <line x1="2" y1="26" x2="26" y2="2" stroke="white" stroke-width="1.5"/>
        <circle cx="18" cy="10" r="2.5" fill="white"/>
      </svg>
    </div>
    <div class="option-meta">
      <span class="option-num">Option 3</span>
      <span class="option-hex">#0f62fe</span>
    </div>
  </div>

  <!-- ── OPTION 4 ── filled square grid with one cell knocked out -->
  <div class="option">
    <div class="size-group">
      <span class="size-label">64px</span>
      <svg width="64" height="64" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#da1e28"/>
        <!-- 3×3 grid of cells, gap=1.5, cell=7 -->
        <!-- row 1 -->
        <rect x="3"    y="3"    width="7" height="7" fill="white"/>
        <rect x="10.5" y="3"    width="7" height="7" fill="white"/>
        <rect x="18"   y="3"    width="7" height="7" fill="white"/>
        <!-- row 2 -->
        <rect x="3"    y="10.5" width="7" height="7" fill="white"/>
        <!-- centre cell knocked out — shows red background -->
        <!-- <rect x="10.5" y="10.5" width="7" height="7" fill="white"/> -->
        <rect x="18"   y="10.5" width="7" height="7" fill="white"/>
        <!-- row 3 -->
        <rect x="3"    y="18"   width="7" height="7" fill="white"/>
        <rect x="10.5" y="18"   width="7" height="7" fill="white"/>
        <rect x="18"   y="18"   width="7" height="7" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">28px</span>
      <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#da1e28"/>
        <rect x="3"    y="3"    width="7" height="7" fill="white"/>
        <rect x="10.5" y="3"    width="7" height="7" fill="white"/>
        <rect x="18"   y="3"    width="7" height="7" fill="white"/>
        <rect x="3"    y="10.5" width="7" height="7" fill="white"/>
        <rect x="18"   y="10.5" width="7" height="7" fill="white"/>
        <rect x="3"    y="18"   width="7" height="7" fill="white"/>
        <rect x="10.5" y="18"   width="7" height="7" fill="white"/>
        <rect x="18"   y="18"   width="7" height="7" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">20px</span>
      <svg width="20" height="20" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#da1e28"/>
        <rect x="3"    y="3"    width="7" height="7" fill="white"/>
        <rect x="10.5" y="3"    width="7" height="7" fill="white"/>
        <rect x="18"   y="3"    width="7" height="7" fill="white"/>
        <rect x="3"    y="10.5" width="7" height="7" fill="white"/>
        <rect x="18"   y="10.5" width="7" height="7" fill="white"/>
        <rect x="3"    y="18"   width="7" height="7" fill="white"/>
        <rect x="10.5" y="18"   width="7" height="7" fill="white"/>
        <rect x="18"   y="18"   width="7" height="7" fill="white"/>
      </svg>
    </div>
    <div class="option-meta">
      <span class="option-num">Option 4</span>
      <span class="option-hex">#da1e28</span>
    </div>
  </div>

  <!-- ── OPTION 5 ── four-point star + orbit arc -->
  <div class="option">
    <div class="size-group">
      <span class="size-label">64px</span>
      <svg width="64" height="64" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#002d9c"/>
        <!-- orbit arc — ellipse partial, tilted feel via arc path -->
        <path d="M 4 20 A 13 7 -30 0 1 24 8" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <!-- four-point star centred at 14,14 -->
        <polygon points="14,6 15.4,12.6 22,14 15.4,15.4 14,22 12.6,15.4 6,14 12.6,12.6" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">28px</span>
      <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#002d9c"/>
        <path d="M 4 20 A 13 7 -30 0 1 24 8" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <polygon points="14,6 15.4,12.6 22,14 15.4,15.4 14,22 12.6,15.4 6,14 12.6,12.6" fill="white"/>
      </svg>
    </div>
    <div class="size-group">
      <span class="size-label">20px</span>
      <svg width="20" height="20" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" fill="#002d9c"/>
        <path d="M 4 20 A 13 7 -30 0 1 24 8" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <polygon points="14,6 15.4,12.6 22,14 15.4,15.4 14,22 12.6,15.4 6,14 12.6,12.6" fill="white"/>
      </svg>
    </div>
    <div class="option-meta">
      <span class="option-num">Option 5</span>
      <span class="option-hex">#002d9c</span>
    </div>
  </div>

</div>

</body>
</html>
